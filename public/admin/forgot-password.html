<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body class="admin-login-page">
    <main class="login-container">
        <div class="login-card">
            <div class="admin-logo">✉️</div>
            <span class="login-label">PASSWORD RECOVERY</span>
            <h1>Forgot your password?</h1>
            <p>Enter your username or recovery email. We'll send a reset link if the account is configured for recovery.</p>

            <form id="forgotForm">
                <div class="admin-field">
                    <label for="identifier">Username or Recovery Email</label>
                    <input id="identifier" type="text" required autocomplete="username email" placeholder="Enter username or email">
                </div>

                <button class="admin-primary" type="submit" id="forgotButton">Send Reset Link →</button>
            </form>

            <p class="error-message" id="errorMessage"></p>
            <p class="success-message" id="successMessage"></p>

            <div class="login-links">
                <a href="/admin/login.html">Back to login</a>
            </div>
        </div>
    </main>
    <script src="/admin/js/forgot-password.js"></script>
</body>
</html>
