<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Reset Password</title>
    <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body class="admin-login-page">
    <main class="login-container">
        <div class="login-card">
            <div class="admin-logo">🔑</div>
            <span class="login-label">PASSWORD RECOVERY</span>
            <h1>Set a new password</h1>
            <p>Choose a new password for your restaurant admin account.</p>

            <form id="resetForm">
                <div class="admin-field">
                    <label for="password">New Password</label>
                    <input id="password" type="password" required autocomplete="new-password" minlength="8" placeholder="At least 8 characters">
                </div>

                <div class="admin-field">
                    <label for="confirmPassword">Confirm New Password</label>
                    <input id="confirmPassword" type="password" required autocomplete="new-password" minlength="8" placeholder="Re-enter password">
                </div>

                <button class="admin-primary" type="submit" id="resetButton">Reset Password →</button>
            </form>

            <p class="error-message" id="errorMessage"></p>
            <p class="success-message" id="successMessage"></p>

            <div class="login-links">
                <a href="/admin/login.html">Back to login</a>
            </div>
        </div>
    </main>
    <script src="/admin/js/reset-password.js"></script>
</body>
</html>
